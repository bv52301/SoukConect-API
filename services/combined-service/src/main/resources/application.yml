server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api

app:
  security:
    enabled: ${SECURITY_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-chars}
    issuer: ${JWT_ISSUER:soukconect}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    # Aggregate documentation from internal + external services
    urls:
      # Internal (Combined) Services
      - name: 1. Core Platform (Vendors, Products, Cart)
        url: /v3/api-docs
      # External Microservices (via Nginx proxies)
      - name: 2. Authentication Service
        url: /auth-api/v3/api-docs
      - name: 3. Order Service
        url: /order-api/v3/api-docs
      - name: 4. Payment Service
        url: /payment-api/v3/api-docs

spring:
  profiles:
    active: combined
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:soukconect}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none       # disable Hibernate DDL validation; rely on db-installer/migrations
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false       # disable Flyway until you need migrations
  main:
    allow-bean-definition-overriding: true
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
